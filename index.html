    <style>

.dropdown {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background-color: #0000;
    z-index: 100;
}

.dropdown-content {
    opacity: 0;
    visibility: hidden;
    position: absolute;
    backdrop-filter: blur(8px);
    min-width: 100px;
    z-index: 1;
    border-radius: 1rem;
    top: 100%;
    transition: opacity 0.3s ease;
}

.dropdown-content a {
    padding: 8px;
    display: block;
    text-align: center;
}

.dropdown-content a:hover {
    transform: scale(1.1);
    transition: transform 0.2s ease;
}

.dropdown-content.show {
    opacity: 1;
    visibility: visible;
}
    </style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropdowns = {
        'x-dropdown': [
            // { name: 'karminski', url: 'https://x.com/karminski3' },
            { name: 'dotey', url: 'https://x.com/dotey' },
        ]
        // 您可以在此添加更多下拉菜单的配置
        // 例如:
        // 'another-icon-id': [
        //   { name: 'Link 1', url: '...' },
        //   { name: 'Link 2', url: '...' }
        // ]
    };

    for (const id in dropdowns) {
        const dropdownElement = document.getElementById(id);
        if (dropdownElement) {
            const content = dropdownElement.querySelector('.dropdown-content');
            const items = dropdowns[id];
            items.forEach(item => {
                const link = document.createElement('a');
                link.href = item.url;
                link.textContent = item.name;
                // link.target = "_self";
                content.appendChild(link);
            });

            dropdownElement.addEventListener('mouseenter', function() {
                content.classList.add('show');
            });

            dropdownElement.addEventListener('mouseleave', function() {
                content.classList.remove('show');
            });
        }
    }
});
</script>
